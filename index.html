<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>RiffDeck | Online Setlist Sync</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
  /* ── GIBSON DARKBURST PREMIUM THEME ── */
  :root {
    --ink:      #0f0a07;   
    --ink-2:    #160e09;   
    --ink-3:    #1f1510;   
    --ink-4:    #2e1f15;   
    --muted:    #4a2e1e;   
    --subtle:   #7a5038;   
    --dim:      #a87050;   
    --text:     #d4b090;   
    --bright:   #e8ccaa;   
    --white:    #f5e6cc;   
    --gold:     #e8a030;   
    --gold-dim: #c07818;   
    --amber:    #d45c10;   
    --teal:     #b87c20;   
    --red:      #c0402a;   

    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-mono: 'DM Mono', 'Courier New', monospace;
    --font-ui:   'Syne', sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background: var(--ink);
    color: var(--text); 
    font-family: var(--font-ui); 
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  }

  /* SVG Noise & Stage Lighting Overlay */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(ellipse 120% 80% at 60% 40%, rgba(180, 90, 10, 0.07) 0%, rgba(120, 50, 5, 0.04) 40%, transparent 70%);
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; opacity: .04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  button { font-family: inherit; cursor: pointer; border: none; outline: none; }
  
  /* ── HEADER ── */
  header {
    background: rgba(15,10,7,.92); border-bottom: 1px solid var(--ink-4);
    padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 1px 0 rgba(232,160,48,.05), 0 4px 24px rgba(0,0,0,.4); z-index: 20; backdrop-filter: blur(24px);
  }
  .brand-wrap { display: flex; align-items: center; gap: 1rem; }
  .menu-toggle { display: none; } 
  
  .brand { 
    font-size: 1.8rem; font-family: var(--font-serif); font-weight: 400; font-style: italic;
    color: var(--gold); letter-spacing: 0.02em;
  }
  
  .search-container { position: relative; width: 400px; max-width: 100%; }
  .search-input {
    width: 100%; padding: 0.6rem 1rem 0.6rem 2.5rem;
    border: 1px solid var(--ink-4); border-radius: 6px;
    font-size: 0.85rem; background: var(--ink-3); color: var(--white);
    font-family: var(--font-ui); transition: all 0.2s; outline: none;
  }
  .search-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(232, 160, 48, 0.15); }
  .search-input::placeholder { color: var(--subtle); }
  .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 0.9rem; }

  /* ── LAYOUT ── */
  .container { display: flex; flex: 1; overflow: hidden; position: relative; }

  /* ── SIDEBAR ── */
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 25;
    opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(3px);
  }
  .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

  .sidebar { 
    width: 280px; background: linear-gradient(180deg, var(--ink-2) 0%, #120c08 100%); 
    border-right: 1px solid var(--ink-4); display: flex; flex-direction: column; z-index: 30;
    box-shadow: inset -1px 0 0 rgba(232,160,48,.04);
  }
  
  .setlist { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .track-btn { 
    background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 12px; 
    text-align: left; transition: 0.2s; position: relative;
  }
  .track-btn:hover { background: var(--ink-3); border-color: var(--ink-4); }
  .track-btn.active { 
    background: var(--ink-3); border-color: var(--gold-dim); 
  }
  .track-title { font-weight: 600; font-size: 0.85rem; color: var(--bright); margin-bottom: 4px; }
  .track-artist { font-size: 0.7rem; color: var(--subtle); font-family: var(--font-ui); }
  
  .sidebar-actions { padding: 1rem; border-top: 1px solid var(--ink-4); display: flex; flex-direction: column; gap: 0.5rem; background: var(--ink-2); }
  .btn-primary { 
    background: var(--ink-3); color: var(--gold); border: 1px solid var(--ink-4);
    padding: 0.8rem; border-radius: 6px; font-weight: 700; text-transform: uppercase; 
    letter-spacing: 0.05em; font-size: 0.75rem; transition: 0.2s;
  }
  .btn-primary:hover { border-color: var(--gold-dim); color: var(--white); background: var(--ink-4); }

  /* Connecting Status */
  .sync-status { padding: 0.8rem 1rem; font-size: 0.7rem; color: var(--dim); border-bottom: 1px solid var(--ink-4); background: var(--ink-2); font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.05em;}
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .sync-dot.online { background: #00ff9d; box-shadow: 0 0 8px rgba(0,255,157,0.4); }

  /* ── MAIN STAGE ── */
  .main-stage { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  
  /* Header Info */
  .track-header { 
    padding: 1.5rem 2.5rem; border-bottom: 1px solid var(--ink-4); display: flex; 
    justify-content: space-between; align-items: center; background: linear-gradient(135deg, rgba(46,31,21,.3) 0%, transparent 55%); 
    flex-wrap: wrap; gap: 1rem;
  }
  .info-group { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
  .info-stat { display: flex; flex-direction: column; }
  .info-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--subtle); margin-bottom: 4px; font-weight: 700;}
  
  #ui-title { font-family: var(--font-serif); font-size: 2.4rem; color: var(--white); font-style: italic; line-height: 1.1; margin-bottom: 4px; }
  .info-val { font-size: 1rem; font-weight: 500; font-family: var(--font-mono); color: var(--gold); }
  
  /* Controls */
  .control-wrap { display: flex; align-items: center; background: var(--ink-3); border: 1px solid var(--ink-4); border-radius: 6px; overflow: hidden; height: 32px;}
  .trans-btn, .scroll-btn { background: transparent; color: var(--dim); width: 32px; height: 100%; font-weight: 800; transition: 0.2s; }
  .trans-btn:hover, .scroll-btn:hover { background: var(--ink-4); color: var(--gold); }
  .val-display { padding: 0 0.8rem; font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; border-left: 1px solid var(--ink-4); border-right: 1px solid var(--ink-4); min-width: 45px; text-align: center; display: flex; align-items: center; justify-content: center; color: var(--white); background: transparent; }
  
  .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .tool-btn { 
    background: var(--ink-3); color: var(--dim); padding: 0 1rem; height: 32px;
    border-radius: 6px; font-weight: 600; font-size: 0.75rem; transition: 0.2s; 
    border: 1px solid var(--ink-4); display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .tool-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .tool-btn.active { background: var(--teal); color: var(--ink-2); border-color: var(--teal); }
  
  .visual-beat { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-4); transition: 0.1s; border: 1px solid var(--ink-4); margin: 0 8px;}
  .visual-beat.tick { background: var(--gold); transform: scale(1.5); box-shadow: 0 0 12px rgba(232,160,48,0.6); border-color: var(--gold); }

  /* Content Area */
  .content-area { flex: 1; display: flex; overflow: hidden; transition: 0.3s; }
  .video-panel { width: 40%; border-right: 1px solid var(--ink-4); padding: 2rem; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); transition: 0.3s; }
  .video-panel.hidden { width: 0; padding: 0; border: none; overflow: hidden; opacity: 0; flex: 0; }
  .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--ink-4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  iframe { width: 100%; height: 100%; border: none; }
  
  /* Tab Sheet */
  .tab-panel { flex: 1; padding: 2.5rem 3rem; overflow-y: auto; background: transparent; scroll-behavior: smooth; }
  pre { font-family: var(--font-mono); font-size: 1.05rem; line-height: 2.2; color: var(--text); white-space: pre-wrap; padding-bottom: 50vh; margin: 0; }
  
  .chord { 
    color: var(--gold); font-weight: 600; 
    font-size: 1em; display: inline-block;
  }
  .section-tag { 
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); background: var(--ink-3); padding: 4px 10px;
    border-radius: 4px; border-left: 2px solid var(--gold); margin-top: 24px; margin-bottom: 8px; font-family: var(--font-ui);
  }

  /* ── EDITOR MODAL ── */
  .modal-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
    z-index: 999 !important; /* Forces Modal to the absolute top */
    display: flex; align-items: center; justify-content: center; 
    opacity: 0; pointer-events: none; transition: 0.2s; 
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--ink-2); border: 1px solid var(--ink-4); border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.8); transform: translateY(20px); transition: 0.3s; }
  .modal-overlay.active .modal-box { transform: translateY(0); }
  .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--ink-4); display: flex; justify-content: space-between; align-items: center; color: var(--gold); font-family: var(--font-serif); font-style: italic; }
  .modal-body { padding: 2rem; overflow-y: auto; display: grid; gap: 1.5rem; grid-template-columns: 1fr 1fr; }
  .full-width { grid-column: span 2; }
  .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .input-group label { font-size: 0.75rem; color: var(--subtle); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .input-group input, .input-group textarea { background: var(--ink-3); border: 1px solid var(--ink-4); padding: 0.8rem 1rem; border-radius: 6px; color: var(--white); font-family: var(--font-ui); outline: none; transition: 0.2s;}
  .input-group input:focus, .input-group textarea:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px rgba(232,160,48,0.1);}
  .input-group textarea { height: 250px; font-family: var(--font-mono); resize: vertical; line-height: 1.6; }
  .modal-footer { padding: 1.5rem 2rem; border-top: 1px solid var(--ink-4); display: flex; justify-content: flex-end; gap: 1rem; flex-wrap: wrap; background: rgba(0,0,0,0.2); border-radius: 0 0 12px 12px;}
  
  .delete-btn { background: rgba(192, 64, 42, 0.1); color: var(--red); border: 1px solid rgba(192, 64, 42, 0.3); margin-right: auto; padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;}
  .delete-btn:hover { background: var(--red); color: #fff; }

  /* ════ MOBILE RESPONSIVE QUERIES ════ */
  @media (max-width: 900px) {
    header { padding: 1rem; flex-wrap: wrap; gap: 1rem; }
    .menu-toggle { 
      display: block; background: transparent; color: var(--gold); 
      font-size: 1.8rem; cursor: pointer; padding: 0; line-height: 1;
    }
    .search-container { width: 100%; order: 3; }
    
    /* FIX 1: SIDEBAR Z-INDEX ABOVE CONTROLS */
    .sidebar {
      position: absolute; top: 0; left: -100%; height: 100%; 
      width: 85%; max-width: 320px; transition: left 0.3s ease;
      z-index: 101 !important; 
    }
    .sidebar.open { left: 0; box-shadow: 10px 0 40px rgba(0,0,0,0.8); }
    .sidebar-overlay { z-index: 100 !important; }
    
    /* FIX 2: BOTTOM-DOCKED CONTROL BAR */
    .track-header { 
      position: fixed; bottom: 0; left: 0; width: 100%;
      z-index: 80; /* High enough to hover over text, lower than menu/modal */
      padding: 1rem; flex-direction: column; align-items: flex-start; 
      background: rgba(15,10,7, 0.95); backdrop-filter: blur(10px);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8); border-top: 1px solid var(--ink-4); border-bottom: none;
    }
    #ui-title { font-size: 2rem; }
    .info-group { width: 100%; gap: 1rem; }
    .info-stat { min-width: 45%; }
    
    .toolbar { width: 100%; justify-content: space-between; margin-top: 0.5rem; }
    
    .content-area { flex-direction: column; }
    .video-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--ink-4); padding: 1rem; background: var(--ink-2); }
    .video-panel.hidden { display: none; }
    
    /* FIX 3: ADD PADDING SO CHORDS CLEAR THE BOTTOM BAR */
    .tab-panel { 
      padding: 1.5rem; 
      padding-bottom: 250px !important; 
    }
    pre { font-size: 0.95rem; }
    
    .modal-body { grid-template-columns: 1fr; padding: 1.5rem; gap: 1rem;}
    .full-width { grid-column: span 1; }
    .modal-footer { flex-direction: column; align-items: stretch; padding: 1.5rem;}
    .delete-btn { margin-right: 0; text-align: center; }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--subtle); }

  /* ── MOBILE VIDEO OPTIMIZATION ── */
  @media (max-width: 900px) {
    .video-panel { 
      position: sticky; top: 0; z-index: 15; 
      transition: all 0.3s ease;
    }

    .video-panel.mini {
      width: 180px; position: fixed; top: auto; bottom: 180px; right: 15px;
      padding: 4px; border: 1px solid var(--ink-4); border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 70;
    }
    
    .video-panel.mini .info-label { display: none; }
    
    .mini-toggle {
      display: block; background: var(--ink-3); color: var(--dim); border: 1px solid var(--ink-4);
      border-radius: 4px; padding: 6px 10px; font-size: 10px; font-weight: 700; margin-bottom: 8px;
      align-self: flex-end; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .video-panel.mini .mini-toggle { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  }

  @media (min-width: 901px) {
    .mini-toggle { display: none; }
  }

  .chord { position: relative; z-index: 1; }
</style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <button id="menu-toggle" class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="brand">RiffDeck</div>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search setlist..." oninput="handleSearch(this.value)">
    </div>
  </header>

  <div class="container">
    
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sync-status" id="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-text">Connecting...</span></div>
      <div class="setlist" id="setlist-container"></div>
      <div class="sidebar-actions">
        <button class="btn-primary" onclick="openEditor()">+ Add New Track</button>
      </div>
    </aside>

    <main class="main-stage">
      <div class="track-header">
        <div class="info-group">
          <div class="info-stat" style="flex: 1; min-width: 100%;">
            <span class="info-val" id="ui-title">Welcome to RiffDeck</span>
          </div>
          
          <div class="info-stat">
            <span class="info-label">Transpose</span>
            <div class="control-wrap">
              <button class="trans-btn" id="btn-trans-down">-</button>
              <span class="val-display" id="ui-key">--</span>
              <button class="trans-btn" id="btn-trans-up">+</button>
            </div>
          </div>

          <div class="info-stat">
            <span class="info-label">BPM</span>
            <span class="info-val" id="ui-bpm" style="margin-top: 4px; font-size: 1.2rem;">--</span>
          </div>
          
          <div class="info-stat">
            <span class="info-label">Auto-Scroll</span>
            <div class="control-wrap">
              <button class="scroll-btn" onclick="adjustScroll(-1)">-</button>
              <button class="val-display" id="btn-scroll-play" onclick="toggleScroll()" style="width:60px; color:var(--gold); cursor:pointer">PLAY</button>
              <button class="scroll-btn" onclick="adjustScroll(1)">+</button>
            </div>
          </div>
        </div>
        
        <div class="toolbar">
          <button class="tool-btn" id="toggle-video-btn" onclick="toggleVideo()">
            <span id="tv-icon">📺</span> Video
          </button>
          <button class="tool-btn" id="metro-toggle">Metronome</button>
          <div class="visual-beat" id="visual-beat"></div>
          <button class="tool-btn" onclick="openEditor(currentTrack.id)">✏️ Edit</button>
        </div>
      </div>

      <div class="content-area">
        <div class="video-panel" id="video-panel">
          <button class="mini-toggle" onclick="toggleMiniVideo()" id="mini-btn">MINI</button>
          <span class="info-label" style="margin-bottom: 0.8rem">Reference Track</span>
          <div class="video-wrapper">
            <iframe id="ui-video" src="" allowfullscreen></iframe>
          </div>
        </div>
        
        <div class="tab-panel" id="tab-panel">
          <pre id="ui-tabs">Configure Firebase below to load your band's setlist online.</pre>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="editor-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 style="font-size:1.6rem;" id="modal-title">Add New Track</h2>
        <button onclick="closeEditor()" style="background:transparent; color:var(--dim); font-size:2rem; line-height: 1;">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="input-group">
          <label>Song Title</label>
          <input type="text" id="edit-title" placeholder="e.g. Starlight">
        </div>
        <div class="input-group">
          <label>Artist</label>
          <input type="text" id="edit-artist" placeholder="e.g. Muse">
        </div>
        <div class="input-group">
          <label>Original Key</label>
          <input type="text" id="edit-key" placeholder="e.g. B">
        </div>
        <div class="input-group">
          <label>BPM</label>
          <input type="number" id="edit-bpm" placeholder="e.g. 122">
        </div>
        <div class="input-group full-width">
          <label>YouTube Video ID (Optional)</label>
          <input type="text" id="edit-yt" placeholder="e.g. Pgum6OT_VH8">
        </div>
        <div class="input-group full-width">
          <label>Lyrics & Chords</label>
          <textarea id="edit-content" placeholder="Put chords in brackets like this: [C] Hello [Am] World... Use [Chorus] or [Verse] for sections."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="delete-btn" id="delete-btn" onclick="deleteSong()" style="display:none">Delete Track</button>
        <button class="tool-btn" style="height: 44px; padding: 0 1.5rem;" onclick="closeEditor()">Cancel</button>
        <button class="btn-primary" onclick="saveSong()">Save to RiffDeck</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    /* =========================================================
       🔥 FIREBASE CONFIGURATION 🔥
       ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyB1UDS2JIPd58H4fFVfHPJynptnsYmWN1g",
      authDomain: "riffdeck.firebaseapp.com",
      databaseURL: "https://riffdeck-default-rtdb.firebaseio.com",
      projectId: "riffdeck",
      storageBucket: "riffdeck.firebasestorage.app",
      messagingSenderId: "806680795500",
      appId: "1:806680795500:web:c1469f06f0bb98876f7b49",
      measurementId: "G-NTG65E6M59"
    };
    
    let db = null;
    let library = [];
    
    // SAFE INITIALIZATION: Try/Catch prevents silent crashes from breaking buttons
    try {
      if (firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        const setlistRef = db.ref('setlist');
        setlistRef.on('value', (snapshot) => {
          const data = snapshot.val();
          library = data ? Object.values(data) : [];
          document.getElementById('sync-dot').classList.add('online');
          document.getElementById('sync-text').textContent = 'Live Sync Active';
          window.renderSidebar();
        });
      }
    } catch (error) {
      console.error("Firebase Connection Error:", error);
      document.getElementById('sync-text').textContent = 'Offline Mode';
      const saved = localStorage.getItem('riffDeckData');
      if (saved) library = JSON.parse(saved);
      window.renderSidebar();
    }

    // Database Save/Remove
    window.saveToDatabase = function(newTrack) {
      if (db) {
        db.ref('setlist/' + newTrack.id).set(newTrack).catch(e => console.error(e));
      } else {
        const index = library.findIndex(t => t.id === newTrack.id);
        if (index > -1) library[index] = newTrack;
        else library.push(newTrack);
        localStorage.setItem('riffDeckData', JSON.stringify(library));
        window.renderSidebar();
        window.loadTrack(newTrack);
      }
    };

    window.removeFromDatabase = function(id) {
      if (db) {
        db.ref('setlist/' + id).remove().catch(e => console.error(e));
      } else {
        library = library.filter(t => t.id !== id);
        localStorage.setItem('riffDeckData', JSON.stringify(library));
        window.renderSidebar();
        window.clearUI();
      }
    };

    /* ════ APP STATE & LOGIC ════ */
    window.currentTrack = null;
    let currentTranspose = 0;
    let isMetroPlaying = false;
    let metroInterval = null;
    let isVideoHidden = false;
    let scrollInterval = null;
    let scrollSpeed = 1; 
    let isScrolling = false;

    const setlistEl = document.getElementById('setlist-container');
    const uiTitle = document.getElementById('ui-title');
    const uiKey = document.getElementById('ui-key');
    const uiBpm = document.getElementById('ui-bpm');
    const uiVideo = document.getElementById('ui-video');
    const uiTabs = document.getElementById('ui-tabs');
    const tabPanel = document.getElementById('tab-panel');
    const metroBtn = document.getElementById('metro-toggle');
    const visualBeat = document.getElementById('visual-beat');

    /* ════ GLOBAL UI FUNCTIONS (100% Attached to Window) ════ */
    
    window.toggleMenu = function() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    };

    window.renderSidebar = function(filteredLib = library) {
      setlistEl.innerHTML = '';
      filteredLib.forEach((track) => {
        const btn = document.createElement('button');
        btn.className = 'track-btn';
        if(window.currentTrack && window.currentTrack.id === track.id) btn.classList.add('active');
        btn.innerHTML = `<div class="track-title">${track.title}</div><div class="track-artist">${track.artist}</div>`;
        btn.onclick = () => window.loadTrack(track);
        setlistEl.appendChild(btn);
      });
      
      if(!window.currentTrack && filteredLib.length > 0) window.loadTrack(filteredLib[0]);
      else if (library.length === 0) window.clearUI();
    };

    window.toggleMiniVideo = function() {
      const panel = document.getElementById('video-panel');
      const btn = document.getElementById('mini-btn');
      const isMini = panel.classList.toggle('mini');
      btn.textContent = isMini ? 'EXPAND' : 'MINI';
    };
    
    window.handleSearch = function(query) {
      const q = query.toLowerCase().trim();
      if (!q) { window.renderSidebar(library); return; }
      const filtered = library.filter(t => 
        t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );
      window.renderSidebar(filtered);
    };

    window.loadTrack = function(track) {
      window.currentTrack = track;
      currentTranspose = 0;
      window.stopScroll();
      
      if (window.innerWidth <= 900) {
         document.getElementById('sidebar').classList.remove('open');
         document.getElementById('sidebar-overlay').classList.remove('active');
      }
      
      document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
      const btns = setlistEl.children;
      for(let i=0; i<library.length; i++) {
        if(library[i].id === track.id && btns[i]) btns[i].classList.add('active');
      }
      
      uiTitle.textContent = `${track.title} - ${track.artist}`;
      uiBpm.textContent = track.bpm || '--';
      uiVideo.src = track.youtube_id ? `https://www.youtube.com/embed/${track.youtube_id}` : '';
      
      window.renderTabs();
      if(isMetroPlaying) { window.stopMetronome(); window.startMetronome(); }
    };

    window.clearUI = function() {
      window.currentTrack = null;
      uiTitle.textContent = "Vault is empty";
      uiBpm.textContent = "--";
      uiKey.textContent = "--";
      uiVideo.src = "";
      uiTabs.innerHTML = "Click '+ Add New Track' to begin.";
    };

    /* ════ TRANSPOSE LOGIC ════ */
    const notes = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'];
    const noteMap = { 'C':0, 'C#':1, 'DB':1, 'D':2, 'D#':3, 'EB':3, 'E':4, 'F':5, 'F#':6, 'GB':6, 'G':7, 'G#':8, 'AB':8, 'A':9, 'A#':10, 'BB':10, 'B':11 };

    window.transposeNote = function(noteStr, steps) {
      if (!noteStr) return "";
      let idx = noteMap[noteStr.toUpperCase()];
      if (idx === undefined) return noteStr;
      let newIdx = (idx + steps) % 12;
      if (newIdx < 0) newIdx += 12;
      return notes[newIdx];
    };

    window.transposeChord = function(chord, steps) {
      if (steps === 0) return chord;
      const regex = /^([A-G][#b]?)(.*)$/i;
      const match = chord.match(regex);
      if (!match) return chord;
      let root = window.transposeNote(match[1], steps);
      let mod = match[2] || "";
      if (mod.includes('/')) {
          let parts = mod.split('/');
          let slashNote = window.transposeNote(parts[1], steps);
          mod = parts[0] + '/' + slashNote;
      }
      return root + mod;
    };

    window.renderTabs = function() {
      if(!window.currentTrack) return;
      let formattedTabs = window.currentTrack.content
        .replace(/\[(.*?)\]/g, (match, innerText) => {
            if (['intro', 'verse', 'chorus', 'pre-chorus', 'solo', 'bridge', 'outro', 'instrumental'].some(s => innerText.toLowerCase().includes(s))) {
                return `<span class="section-tag">${innerText}</span>`;
            } else {
                let tChord = window.transposeChord(innerText, currentTranspose);
                return `<span class="chord">${tChord}</span>`;
            }
        });
      uiTabs.innerHTML = formattedTabs;

      let baseKeyMatch = (window.currentTrack.key || "").match(/^([A-G][#b]?)(.*)$/i);
      if (baseKeyMatch) {
          let tKey = window.transposeChord(baseKeyMatch[1], currentTranspose) + baseKeyMatch[2];
          let tString = currentTranspose === 0 ? "" : currentTranspose > 0 ? ` (+${currentTranspose})` : ` (${currentTranspose})`;
          uiKey.textContent = tKey + tString;
      } else {
          uiKey.textContent = window.currentTrack.key || "--";
      }
    };

    document.getElementById('btn-trans-up').addEventListener('click', () => { currentTranspose++; window.renderTabs(); });
    document.getElementById('btn-trans-down').addEventListener('click', () => { currentTranspose--; window.renderTabs(); });

    /* ════ METRONOME ════ */
    window.startMetronome = function() {
      const bpm = window.currentTrack ? window.currentTrack.bpm : 120;
      if (!bpm || bpm <= 0) return;
      isMetroPlaying = true;
      metroBtn.classList.add('active');
      metroInterval = setInterval(() => {
        visualBeat.classList.add('tick');
        setTimeout(() => visualBeat.classList.remove('tick'), 100);
      }, 60000 / bpm);
    };
    
    window.stopMetronome = function() {
      isMetroPlaying = false;
      metroBtn.classList.remove('active');
      clearInterval(metroInterval);
    };
    
    metroBtn.addEventListener('click', () => { isMetroPlaying ? window.stopMetronome() : window.startMetronome(); });

    /* ════ AUTO SCROLL ════ */
    window.toggleScroll = function() {
      const btn = document.getElementById('btn-scroll-play');
      if(isScrolling) {
        window.stopScroll();
      } else {
        isScrolling = true;
        btn.textContent = "STOP";
        scrollInterval = setInterval(() => {
          tabPanel.scrollTop += scrollSpeed;
        }, 50);
      }
    };
    
    window.stopScroll = function() {
      isScrolling = false;
      clearInterval(scrollInterval);
      const btn = document.getElementById('btn-scroll-play');
      btn.textContent = "PLAY";
    };
    
    window.adjustScroll = function(dir) {
      scrollSpeed += dir;
      if(scrollSpeed < 1) scrollSpeed = 1;
      if(scrollSpeed > 10) scrollSpeed = 10;
      if(isScrolling) { window.stopScroll(); window.toggleScroll(); }
    };

    /* ════ THEATER MODE ════ */
    window.toggleVideo = function() {
      isVideoHidden = !isVideoHidden;
      const panel = document.getElementById('video-panel');
      const btn = document.getElementById('toggle-video-btn');
      if(isVideoHidden) {
        panel.classList.add('hidden');
        btn.classList.add('active');
        uiVideo.src = ""; 
      } else {
        panel.classList.remove('hidden');
        btn.classList.remove('active');
        if(window.currentTrack) uiVideo.src = window.currentTrack.youtube_id ? `https://www.youtube.com/embed/${window.currentTrack.youtube_id}` : '';
      }
    };

    /* ════ EDITOR MODAL ════ */
    const modal = document.getElementById('editor-modal');
    
    window.openEditor = function(id = null) {
      document.getElementById('delete-btn').style.display = id ? 'block' : 'none';
      document.getElementById('modal-title').textContent = id ? 'Edit Track' : 'Add New Track';
      
      if (id && window.currentTrack) {
        document.getElementById('edit-id').value = window.currentTrack.id;
        document.getElementById('edit-title').value = window.currentTrack.title;
        document.getElementById('edit-artist').value = window.currentTrack.artist;
        document.getElementById('edit-key').value = window.currentTrack.key;
        document.getElementById('edit-bpm').value = window.currentTrack.bpm;
        document.getElementById('edit-yt').value = window.currentTrack.youtube_id;
        document.getElementById('edit-content').value = window.currentTrack.content;
      } else {
        document.getElementById('edit-id').value = '';
        document.getElementById('edit-title').value = '';
        document.getElementById('edit-artist').value = '';
        document.getElementById('edit-key').value = '';
        document.getElementById('edit-bpm').value = '';
        document.getElementById('edit-yt').value = '';
        document.getElementById('edit-content').value = '';
      }
      modal.classList.add('active');
    };

    window.closeEditor = function() { modal.classList.remove('active'); };

    window.saveSong = function() {
      const id = document.getElementById('edit-id').value;
      const newTrack = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('edit-title').value || 'Untitled',
        artist: document.getElementById('edit-artist').value || 'Unknown',
        key: document.getElementById('edit-key').value,
        bpm: parseInt(document.getElementById('edit-bpm').value) || 0,
        youtube_id: document.getElementById('edit-yt').value,
        content: document.getElementById('edit-content').value
      };
      
      window.saveToDatabase(newTrack);
      window.closeEditor();
    };

    window.deleteSong = function() {
      if(!confirm("Are you sure you want to delete this track?")) return;
      const id = parseInt(document.getElementById('edit-id').value);
      window.removeFromDatabase(id);
      window.closeEditor();
    };

    // Load initial data on startup if offline
    if (!db) {
      const saved = localStorage.getItem('riffDeckData');
      if (saved) {
        library = JSON.parse(saved);
        window.renderSidebar();
      }
    }
  </script>
</body>
</html>
